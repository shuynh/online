  <script>
    // skier eases toward the last finger/mouse x; arrow keys nudge the target
    var skier = document.querySelector('.skier'), x = innerWidth / 2, target = x, dir = 0;
    function steer(e) { target = e.clientX; }
    addEventListener('pointerdown', steer);
    addEventListener('pointermove', steer);
    addEventListener('keydown', function (e) { if (e.key == 'ArrowLeft') dir = -1; if (e.key == 'ArrowRight') dir = 1; });
    addEventListener('keyup', function (e) { if (e.key == 'ArrowLeft' || e.key == 'ArrowRight') dir = 0; });
    (function frame() {
      target = Math.max(8, Math.min(innerWidth - 8, target + dir * 6));
      var dx = (target - x) * 0.1;
      x += dx;
      skier.style.left = x + 'px';
      skier.style.transform = 'rotate(' + Math.max(-45, Math.min(45, -dx * 3)) + 'deg)';
      requestAnimationFrame(frame);
    })();
  </script>
